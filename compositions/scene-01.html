        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var cam = root.querySelector("#s1-camera");
            var doorLeaf = root.querySelector("#s1-door-leaf");
            var charEl = root.querySelector("#s1-character");
            var legL = root.querySelector("#s1-leg-l");
            var legR = root.querySelector("#s1-leg-r");
            var armR = root.querySelector("#s1-arm-r");
            var echoEl = root.querySelector("#s1-echo");
            var ring1 = root.querySelector("#s1-ring-1");
            var ring2 = root.querySelector("#s1-ring-2");
            var qmark = root.querySelector("#s1-qmark");
            var pill1 = root.querySelector("#s1-pill-1");
            var pill2 = root.querySelector("#s1-pill-2");

            var walkState = { x: 154, stride: 0 };
            function syncCharacter() {
              var swing = Math.sin(walkState.stride) * 26;
              var bob = Math.abs(Math.sin(walkState.stride)) * -7;
              gsap.set(charEl, { attr: { transform: "translate(" + walkState.x.toFixed(1) + ", " + (738 + bob).toFixed(1) + ")" } });
              gsap.set(legL, { attr: { x2: (-14 - swing).toFixed(1) } });
              gsap.set(legR, { attr: { x2: (16 + swing).toFixed(1) } });
              gsap.set(armR, { attr: { x2: (28 - swing * 0.7).toFixed(1) } });
            }

            var tl = gsap.timeline({ paused: true });

            // Shot 1 (0 -> 2.76s): Door swings open, Nara walks in, full-screen camera widens gently
            tl.fromTo(doorLeaf, { scaleX: 1 }, { scaleX: 0.18, duration: 0.78, ease: "power3.out" }, 0.05);
            tl.fromTo(
              walkState,
              { x: 154, stride: 0 },
              { x: 465, stride: Math.PI * 4, duration: 2.55, ease: "power2.out", onUpdate: syncCharacter },
              0.15
            );
            tl.fromTo(cam, { scale: 1.05, x: 26, y: 0 }, { scale: 1, x: 0, y: 0, duration: 2.6, ease: "power2.inOut" }, 0);

            // Shot 2 (2.76 -> 5.77s): Camera push-in, ghost room echo + ripples + question badge
            tl.to(cam, { scale: 1.14, x: 14, y: 20, duration: 1.4, ease: "power2.inOut" }, 2.76);
            tl.fromTo(echoEl, { opacity: 0, x: 24, y: -14 }, { opacity: 0.92, x: 0, y: 0, duration: 0.45, ease: "power2.out" }, 3.02);
            tl.to(echoEl, { opacity: 0.35, duration: 0.5, ease: "power1.inOut" }, 3.8);
            tl.to(echoEl, { opacity: 0.9, duration: 0.35, ease: "power2.out" }, 4.4);

            tl.fromTo(ring1, { attr: { r: 44 }, opacity: 0.95 }, { attr: { r: 230 }, opacity: 0, duration: 1.35, ease: "power2.out" }, 3.05);
            tl.fromTo(ring2, { attr: { r: 44 }, opacity: 0.9 }, { attr: { r: 290 }, opacity: 0, duration: 1.45, ease: "power2.out" }, 3.5);
            tl.fromTo(qmark, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.8)" }, 3.12);

            // Pill swap
            tl.to(pill1, { opacity: 0, filter: "blur(6px)", duration: 0.22, ease: "power2.in" }, 2.7);
            tl.fromTo(pill2, { opacity: 0, filter: "blur(6px)", y: 8 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.28, ease: "power3.out" }, 2.88);

            // Exit into Scene 2 sky
            tl.to(cam, { scale: 1.22, opacity: 0.12, duration: 0.35, ease: "power3.in" }, 5.42);

            syncCharacter();
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["scene-01"] = tl;
          })();
        </script>
