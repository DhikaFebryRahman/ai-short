        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var stage = root.querySelector("#s1-stage");
            var camera = root.querySelector("#s1-camera");
            var jellyPos = root.querySelector("#s1-jelly-pos");
            var jellyAnim = root.querySelector("#s1-jelly-anim");
            var bell = root.querySelector("#s1-bell");
            var tentacles = root.querySelector("#s1-tentacles");
            var echoAnim = root.querySelector("#s1-echo-anim");
            var returnArc = root.querySelector("#s1-return-arc");
            var bubbles = root.querySelector("#s1-bubbles");
            var heroBadge = root.querySelector("#s1-hero-badge");
            var pill1 = root.querySelector("#s1-pill-1");
            var pill2 = root.querySelector("#s1-pill-2");
            var wipe = root.querySelector("#s1-wipe");

            gsap.set(stage, { opacity: 1 });
            gsap.set(camera, { scale: 1, x: 0, y: 0 });
            gsap.set(jellyAnim, { scale: 0.85, opacity: 0.9, transformOrigin: "50% 35%" });
            gsap.set(bell, { scaleX: 1, scaleY: 1, transformOrigin: "50% 50%" });
            gsap.set(tentacles, { scaleY: 1, transformOrigin: "50% 0%" });
            gsap.set(echoAnim, { scale: 0.65, opacity: 0, transformOrigin: "50% 50%" });
            gsap.set(heroBadge, { opacity: 0, scale: 0.72, y: 18 });
            gsap.set(pill1, { opacity: 0, y: 14 });
            gsap.set(pill2, { opacity: 0, y: 14 });

            var arcLen = returnArc.getTotalLength();
            gsap.set(returnArc, { strokeDasharray: arcLen, strokeDashoffset: arcLen, opacity: 0 });

            // Deterministic swimming bell pulse phase across 6.70s
            var swim = { t: 0 };
            function syncSwim() {
              var s = Math.sin(swim.t * Math.PI * 2);
              var c = Math.cos(swim.t * Math.PI * 2);
              var yFloat = 790 - swim.t * 42 + s * 18;
              gsap.set(jellyPos, { attr: { transform: "translate(540, " + yFloat.toFixed(1) + ")" } });
              gsap.set(bell, { scaleX: 1 + s * 0.06, scaleY: 1 - s * 0.07 });
              gsap.set(tentacles, { scaleY: 1 + c * 0.05, skewX: s * 3.2 });
            }

            var tl = gsap.timeline({ paused: true });

            // Gentle continuous swimming + camera push-in (wide -> close)
            tl.to(swim, { t: 2.2, duration: 6.70, ease: "none", onUpdate: syncSwim }, 0);
            tl.fromTo(jellyAnim, { scale: 0.86, opacity: 0.92 }, { scale: 1, opacity: 1, duration: 1.4, ease: "power2.out" }, 0);
            tl.to(camera, { scale: 1.17, x: 0, y: 28, duration: 3.1, ease: "power1.inOut" }, 0.15);
            tl.to(bubbles, { y: -95, duration: 6.70, ease: "none" }, 0);

            // "ABADI?" builds curiosity on Beat 1
            tl.to(pill1, { opacity: 1, y: 0, duration: 0.32, ease: "back.out(1.7)" }, 1.25);
            tl.to(heroBadge, { opacity: 1, scale: 1, y: 0, duration: 0.36, ease: "back.out(1.9)" }, 1.95);

            // Young medusa echo clue reveals ("bisa kembali ke tahap hidup yang lebih muda")
            tl.to(heroBadge, { opacity: 0, y: -16, duration: 0.25, ease: "power2.in", immediateRender: false }, 3.25);
            tl.to(camera, { scale: 1.08, x: -24, y: 12, duration: 1.1, ease: "power2.inOut", immediateRender: false }, 3.35);
            tl.to(returnArc, { opacity: 0.95, strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 3.45);
            tl.to(echoAnim, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 3.55);
            tl.to(pill1, { opacity: 0, y: -10, duration: 0.22, ease: "power2.in", immediateRender: false }, 3.85);
            tl.to(pill2, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 4.05);

            // Re-center full focus on adult medusa + smooth cross-dissolve out (6.25..6.70s)
            tl.to([echoAnim, returnArc], { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, 5.45);
            tl.to(camera, { scale: 1.14, x: 0, y: 20, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 5.45);
            tl.to(stage, { opacity: 0, duration: 0.45, ease: "sine.inOut" }, 6.25);

            syncSwim();
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-01"] = tl;
          })();
