        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var stage = root.querySelector("#s2-stage");
            var camera = root.querySelector("#s2-camera");
            var speciesCard = root.querySelector("#s2-species-card");
            var pointers = root.querySelector("#s2-pointers");
            var medusaPos = root.querySelector("#s2-medusa-pos");
            var medusaAnim = root.querySelector("#s2-medusa-anim");
            var bell = root.querySelector("#s2-bell");
            var tentacles = root.querySelector("#s2-tentacles");
            var stressWash = root.querySelector("#s2-stress-wash");
            var stressRings = root.querySelector("#s2-stress-rings");
            var cystAnim = root.querySelector("#s2-cyst-anim");
            var pill1 = root.querySelector("#s2-pill-1");
            var pill2 = root.querySelector("#s2-pill-2");
            var pill3 = root.querySelector("#s2-pill-3");
            var pill4 = root.querySelector("#s2-pill-4");

            gsap.set(stage, { opacity: 0 });
            gsap.set(camera, { scale: 1.06, y: 16 });
            gsap.set(bell, { transformOrigin: "50% 50%" });
            gsap.set(tentacles, { transformOrigin: "50% 0%" });
            gsap.set(medusaAnim, { scale: 1, opacity: 1, transformOrigin: "50% 28%" });
            gsap.set(stressRings, { scale: 0.85, rotation: 0, opacity: 0, svgOrigin: "540 615" });
            gsap.set(cystAnim, { scale: 0.35, opacity: 0, transformOrigin: "50% 50%" });

            // Swim phase 0..2.5s then slow down & sink toward rock
            var swim = { p: 0 };
            function syncSwim() {
              var s = Math.sin(swim.p * Math.PI * 2);
              gsap.set(bell, { scaleX: 1 + s * 0.05, scaleY: 1 - s * 0.06 });
              gsap.set(tentacles, { skewX: s * 3 });
            }

            var tl = gsap.timeline({ paused: true });

            // Smooth cross-dissolve in (0..0.45s) & out (15.30..15.75s)
            tl.to(stage, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 0);
            tl.to(stage, { opacity: 0, duration: 0.45, ease: "sine.inOut" }, 15.30);

            // Beat 1: Species intro + anatomical callouts (0.2..2.7s -> abs 6.45..8.95s)
            tl.to(camera, { scale: 1.0, y: 0, duration: 1.2, ease: "power2.out" }, 0.1);
            tl.to(swim, { p: 1.5, duration: 2.8, ease: "power1.out", onUpdate: syncSwim }, 0.2);
            tl.fromTo(speciesCard, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.45);
            tl.fromTo(pointers, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.75);
            tl.fromTo(pill1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 0.55);

            // Beat 2: Injury / Aging / Bad environmental condition (2.7..6.6s -> abs 8.95..12.85s)
            tl.to(pointers, { opacity: 0, duration: 0.3, immediateRender: false }, 2.65);
            tl.to(speciesCard, { opacity: 0, y: -10, duration: 0.3, immediateRender: false }, 2.75);
            tl.to(pill1, { opacity: 0, y: -10, duration: 0.22, immediateRender: false }, 2.85);
            tl.fromTo(pill2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.32, ease: "back.out(1.6)" }, 3.05);
            tl.to(stressWash, { opacity: 0.24, duration: 0.6, ease: "power2.out" }, 3.05);
            tl.to(stressRings, { opacity: 0.92, scale: 1, duration: 0.5, ease: "power2.out" }, 3.2);
            tl.to(stressRings, { rotation: 36, scale: 1.04, duration: 2.6, ease: "sine.inOut", immediateRender: false }, 3.75);
            tl.to(medusaAnim, { rotation: -8, duration: 1.2, ease: "sine.inOut" }, 3.5);

            // Beat 3: Shrink radially into center while settling to rock surface -> Kista (6.6..12.2s)
            tl.to(pill2, { opacity: 0, y: -10, duration: 0.22, immediateRender: false }, 6.6);
            tl.fromTo(pill3, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.32, ease: "back.out(1.6)" }, 6.8);
            tl.to([stressWash, stressRings], { opacity: 0, duration: 0.8, immediateRender: false }, 6.7);

            // Reset tilt first and shrink into bell center (0px -68px) while descending to (540, 1020)
            var sinkPos = { y: 680 };
            tl.to(sinkPos, {
              y: 1035,
              duration: 3.3,
              ease: "power2.inOut",
              onUpdate: function () {
                gsap.set(medusaPos, { attr: { transform: "translate(540, " + sinkPos.y.toFixed(1) + ")" } });
              },
            }, 6.8);

            // Tentacles retract cleanly toward center; bell shrinks centered into a compact orb
            tl.to(tentacles, { scaleY: 0.05, opacity: 0, duration: 1.9, ease: "power2.in", immediateRender: false }, 6.8);
            tl.to(medusaAnim, { scale: 0.36, rotation: 0, duration: 2.9, ease: "power2.inOut", immediateRender: false }, 6.9);

            // Cyst forms cleanly on centered rock surface around 9.4..10.4s
            tl.to(medusaAnim, { opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 9.4);
            tl.to(cystAnim, { opacity: 1, scale: 1, duration: 0.85, ease: "back.out(1.5)" }, 9.35);

            // Beat 4: Close-up on Cyst + Conditional badge (10.7..15.30s)
            tl.to(pill3, { opacity: 0, y: -10, duration: 0.22, immediateRender: false }, 10.3);
            tl.fromTo(pill4, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.34, ease: "back.out(1.6)" }, 10.55);
            tl.to(camera, { scale: 1.24, x: 0, y: -70, duration: 2.2, ease: "power2.inOut", immediateRender: false }, 10.6);
            tl.to(cystAnim, { scale: 1.05, duration: 1.6, ease: "sine.inOut", immediateRender: false }, 13.0);

            syncSwim();
            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-02"] = tl;
          })();
        </script>
