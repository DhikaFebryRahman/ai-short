        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var stage = root.querySelector("#s3-stage");
            var camera = root.querySelector("#s3-camera");
            var cystAnim = root.querySelector("#s3-cyst-anim");
            var polypAnim = root.querySelector("#s3-polyp-anim");
            var bud = root.querySelector("#s3-bud");
            var newPos = root.querySelector("#s3-new-pos");
            var newAnim = root.querySelector("#s3-new-anim");
            var stageBar = root.querySelector("#s3-stage-bar");
            var step2 = root.querySelector("#s3-step-2");
            var step3 = root.querySelector("#s3-step-3");
            var pill1 = root.querySelector("#s3-pill-1");
            var pill2 = root.querySelector("#s3-pill-2");
            var pill3 = root.querySelector("#s3-pill-3");

            gsap.set(stage, { opacity: 0 });
            gsap.set(camera, { scale: 1.22, y: -65 });
            gsap.set(cystAnim, { scale: 1, y: 0, opacity: 1, transformOrigin: "50% 80%" });
            gsap.set(polypAnim, { scaleY: 0.05, y: 42, opacity: 0, transformOrigin: "50% 97%" });
            gsap.set(bud, { scale: 0, transformOrigin: "50% 50%" });
            gsap.set(newAnim, { scale: 0.35, opacity: 0, transformOrigin: "50% 35%" });

            var tl = gsap.timeline({ paused: true });

            // Smooth cross-dissolve in (0..0.45s) & out (9.23..9.68s)
            tl.to(stage, { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 0);
            tl.to(stage, { opacity: 0, duration: 0.45, ease: "sine.inOut" }, 9.23);

            // Beat 1: Cyst settles & Polyp emerges upward from bottom rock surface (0.2..4.1s)
            tl.fromTo(stageBar, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.35);
            tl.fromTo(pill1, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.35);
            tl.to(cystAnim, { scale: 1.06, duration: 0.65, ease: "sine.inOut" }, 0.55);
            tl.to(cystAnim, { opacity: 0, scaleY: 0.45, y: 24, duration: 0.55, ease: "power2.in", immediateRender: false }, 2.05);
            tl.to(polypAnim, { opacity: 1, scaleY: 1, y: 0, duration: 1.35, ease: "power3.out" }, 2.1);
            tl.call(function () { step2.className = "s3-step is-green"; }, [], 3.05);

            // Beat 2: Pull back + colony polyp & budding sprout (3.9..6.6s)
            tl.to(camera, { scale: 1.0, y: 0, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 3.9);
            tl.to(pill1, { opacity: 0, y: -10, duration: 0.22, immediateRender: false }, 4.0);
            tl.fromTo(pill2, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 4.25);
            tl.to(bud, { scale: 1, duration: 0.9, ease: "back.out(1.7)" }, 4.7);

            // Beat 3: Bud releases tiny new Medusa swimming upward to center x=540 (6.6..9.43s)
            tl.to(pill2, { opacity: 0, y: -10, duration: 0.22, immediateRender: false }, 6.55);
            tl.fromTo(pill3, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 6.75);
            tl.to(bud, { scale: 0.2, opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, 6.65);
            tl.call(function () { step3.className = "s3-step is-cyan"; }, [], 6.9);

            var swimNew = { p: 0 };
            tl.to(newAnim, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 6.7);
            tl.to(swimNew, {
              p: 1,
              duration: 2.5,
              ease: "power2.out",
              onUpdate: function () {
                var nx = 636 - swimNew.p * 96;
                var ny = 845 - swimNew.p * 275 + Math.sin(swimNew.p * Math.PI * 3) * 14;

            }, 6.75);
            tl.to(camera, { scale: 1.12, x: 0, y: 55, duration: 1.4, ease: "power2.inOut", immediateRender: false }, 7.9);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-03"] = tl;
