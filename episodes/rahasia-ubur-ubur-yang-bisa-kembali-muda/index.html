<!doctype html>
<html
  lang="id"
  data-resolution="portrait"
  data-composition-variables='[
    { "id": "series_label", "type": "string", "label": "Label Seri", "default": "KAPSUL FAKTA" },
    { "id": "accent_amber", "type": "color", "label": "Aksen Amber", "default": "#FFB703" },
    { "id": "accent_cyan", "type": "color", "label": "Aksen Cyan", "default": "#0EA5E9" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kapsul Fakta: Rahasia Ubur-Ubur yang Bisa Kembali Muda</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --sea-top: #8ad8ff;
        --sea-mid: #dff6ff;
        --sand-warm: #fde7c4;
        --ink: #142244;
        --muted: #243b6b;
        --amber: #ffb703;
        --amber-ink: #9a3412;
        --cyan: #0ea5e9;
        --cyan-ink: #0369a1;
        --green: #10b981;
        --green-ink: #047857;
        --coral: #fb7185;
        --coral-ink: #be123c;
        --font-display: "Poppins", sans-serif;
        --font-serif: "Playfair Display", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--sea-mid);
        font-family: var(--font-display);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, #8ad8ff 0%, #dff6ff 55%, #fde7c4 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="54"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="backdrop"
        data-composition-id="backdrop"
        data-composition-src="compositions/backdrop.html"
        data-track-kind="graphics"
        data-track-index="0"
        data-start="0"
        data-duration="54"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="scene-01"

        data-height="1920"

        data-width="1080"
        data-height="1920"
        style="z-index: 40"
      ></div>

      <!-- Audio Tracks: VO starts at 1.0s, BGM + SFX mixed cleanly below VO -->
      <audio
        id="vo-track"
        class="clip"
        src="assets/audio/vo.mp3"
        data-start="1"
        data-duration="50.68"
        data-volume="1"
        data-track-index="4"
      ></audio>
      <audio
        id="bgm-part1"
        class="clip"

      ></audio>
      <audio
        id="bgm-part2"

        data-volume="0.14"
        data-fade-out="1.6"

      <audio id="sfx-pop-1" class="clip" src="assets/audio/sfx/pop-bubble.wav" data-start="1.95" data-duration="0.28" data-volume="0.26" data-track-index="6"></audio>

      <audio id="sfx-shimmer-2" class="clip" src="assets/audio/sfx/morph-shimmer.wav" data-start="23.25" data-duration="0.95" data-volume="0.24" data-track-index="6"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/audio/sfx/pop-bubble.wav" data-start="25.95" data-duration="0.28" data-volume="0.26" data-track-index="6"></audio>
      <audio id="sfx-drop-2" class="clip" src="assets/audio/sfx/water-drop.wav" data-start="28.35" data-duration="0.36" data-volume="0.28" data-track-index="6"></audio>
      <audio id="sfx-whoosh-3" class="clip" src="assets/audio/sfx/whoosh-soft.wav" data-start="30.65" data-duration="0.72" data-volume="0.22" data-track-index="6"></audio>

      <audio id="sfx-shimmer-3" class="clip" src="assets/audio/sfx/morph-shimmer.wav" data-start="34.15" data-duration="0.95" data-volume="0.24" data-track-index="6"></audio>
      <audio id="sfx-pop-4" class="clip" src="assets/audio/sfx/pop-bubble.wav" data-start="37.45" data-duration="0.28" data-volume="0.24" data-track-index="6"></audio>
      <audio id="sfx-whoosh-4" class="clip" src="assets/audio/sfx/whoosh-soft.wav" data-start="40.60" data-duration="0.72" data-volume="0.22" data-track-index="6"></audio>

      <audio id="sfx-pulse-2" class="clip" src="assets/audio/sfx/pulse-soft.wav" data-start="42.35" data-duration="0.55" data-volume="0.26" data-track-index="6"></audio>
      <audio id="sfx-chime-1" class="clip" src="assets/audio/sfx/gleam-chime.wav" data-start="49.25" data-duration="1.55" data-volume="0.28" data-track-index="6"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
