<!doctype html>
<html
  lang="id"
  data-resolution="portrait"
  data-composition-variables='[
    { "id": "series_label", "type": "string", "label": "Label Seri", "default": "KAPSUL FAKTA" },
    { "id": "accent_amber", "type": "color", "label": "Aksen Amber", "default": "#FBBF24" },
    { "id": "accent_cyan", "type": "color", "label": "Aksen Cyan", "default": "#38BDF8" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kapsul Fakta: Mengapa Otak Masih Memproses Suara Saat Tidur</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --night-top: #060c1f;
        --night-mid: #0b1636;
        --night-bot: #11224a;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --amber: #fbbf24;
        --amber-soft: #fde68a;
        --cyan: #38bdf8;
        --cyan-soft: #7dd3fc;
        --green: #34d399;
        --green-soft: #6ee7b7;
        --coral: #fb7185;
        --coral-soft: #fda4af;
        --font-display: "Poppins", sans-serif;
        --font-serif: "Playfair Display", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night-mid);
        font-family: var(--font-display);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, #060c1f 0%, #0b1636 52%, #11224a 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="68"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="backdrop"
        data-composition-id="backdrop"
        data-composition-src="compositions/backdrop.html"
        data-track-kind="graphics"
        data-track-index="0"
        data-start="0"
        data-duration="68"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="scene-01"
        data-composition-id="scene-01"
        data-composition-src="compositions/scene-01.html"
        data-track-kind="graphics"
        data-track-index="1"
        data-start="0"
        data-duration="9.65"
        data-width="1080"
        data-height="1920"
        style="z-index: 10"
      ></div>
      <div
        id="scene-02"
        data-composition-id="scene-02"

        data-width="1080"
        data-height="1920"
        style="z-index: 11"
      ></div>
      <div

        data-track-index="1"
        data-start="23.27"
        data-duration="17.63"
        data-width="1080"
        data-height="1920"
        style="z-index: 12"
      ></div>
      <div
        id="scene-04"
        data-composition-id="scene-04"
        data-composition-src="compositions/scene-04.html"
        data-track-kind="graphics"
        data-track-index="1"
        data-start="40.42"
        data-duration="14.98"
        data-width="1080"
        data-height="1920"
        style="z-index: 13"
      ></div>
      <div
        id="scene-05"
        data-composition-id="scene-05"

        data-duration="13.08"

      <div

        data-track-kind="graphics"
        data-track-index="2"
        data-start="0"
        data-duration="68"
        data-width="1080"
        data-height="1920"
        style="z-index: 30"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-track-index="3"
        data-start="0"
        data-duration="68"
        data-width="1080"
        data-height="1920"
        style="z-index: 40"
      ></div>

      <!-- VOICEOVER UTAMA (dimulai di detik 1.0, durasi utuh 65.15s + ~1.85s jeda penutup -> 68s) -->
      <audio
        id="vo"
        class="clip"
        src="assets/audio/vo.mp3"
        data-start="1"
        data-duration="65.15"
        data-volume="1"
        data-track-index="4"
      ></audio>

      <!-- BGM DETERMINISTIK MALAM HARI -->
      <audio
        id="bgm"
        class="clip"
        src="assets/audio/bgm.wav"
        data-start="0"
        data-duration="68"
        data-volume="0.34"
        data-fade-in="1.0"
        data-fade-out="2.0"
        data-track-index="5"
      ></audio>

      <!-- SFX CUES -->
      <audio id="sfx-s1-call" class="clip" src="assets/audio/sfx/voice-call.wav" data-start="3.50" data-duration="0.75" data-volume="0.30" data-track-index="6"></audio>
      <audio id="sfx-s1-brain" class="clip" src="assets/audio/sfx/pop-bubble.wav" data-start="4.60" data-duration="0.28" data-volume="0.26" data-track-index="6"></audio>

      <audio id="sfx-s2-whoosh" class="clip" src="assets/audio/sfx/whoosh-soft.wav" data-start="9.17" data-duration="0.95" data-volume="0.22" data-track-index="6"></audio>

      <audio id="sfx-s2-filter" class="clip" src="assets/audio/sfx/pop-bubble.wav" data-start="19.60" data-duration="0.28" data-volume="0.25" data-track-index="6"></audio>

      <audio id="sfx-s3-whoosh" class="clip" src="assets/audio/sfx/whoosh-soft.wav" data-start="23.27" data-duration="0.95" data-volume="0.22" data-track-index="6"></audio>
      <audio id="sfx-s3-name" class="clip" src="assets/audio/sfx/voice-call.wav" data-start="29.00" data-duration="0.75" data-volume="0.30" data-track-index="6"></audio>
      <audio id="sfx-s3-sudden" class="clip" src="assets/audio/sfx/alarm-ping.wav" data-start="32.20" data-duration="0.55" data-volume="0.24" data-track-index="6"></audio>

      <audio id="sfx-s4-whoosh" class="clip" src="assets/audio/sfx/whoosh-soft.wav" data-start="40.42" data-duration="0.95" data-volume="0.22" data-track-index="6"></audio>
      <audio id="sfx-s4-n3" class="clip" src="assets/audio/sfx/eeg-pulse.wav" data-start="41.80" data-duration="0.90" data-volume="0.30" data-track-index="6"></audio>
      <audio id="sfx-s4-compare" class="clip" src="assets/audio/sfx/pop-bubble.wav" data-start="48.50" data-duration="0.28" data-volume="0.24" data-track-index="6"></audio>

      <audio id="sfx-s5-whoosh" class="clip" src="assets/audio/sfx/whoosh-soft.wav" data-start="54.92" data-duration="0.95" data-volume="0.22" data-track-index="6"></audio>
      <audio id="sfx-s5-watch" class="clip" src="assets/audio/sfx/gleam-chime.wav" data-start="62.80" data-duration="1.68" data-volume="0.26" data-track-index="6"></audio>
    </div>

    <script>
      (function () {
        "use strict";
        var tl = gsap.timeline({ paused: true });
        tl.to({}, { duration: 68 }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
