        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelector(s); };
            var stage = q("#s1-clip"), cam = q("#s1-cam"), chest = q("#s1-chest"), head = q("#s1-head");
            var st1 = q("#s1-star-1"), st2 = q("#s1-star-2"), halo = q("#s1-lamp-halo"), clk = q("#s1-clock-txt");
            var z1 = q("#s1-z1"), z2 = q("#s1-z2"), z3 = q("#s1-z3"), z4 = q("#s1-z4"), z5 = q("#s1-z5");
            var caller = q("#s1-caller"), waves = q("#s1-call-waves"), cw1 = q("#s1-cw-1"), cw2 = q("#s1-cw-2"), cw3 = q("#s1-cw-3");
            var brainGlow = q("#s1-brain-glow"), spark = q("#s1-brain-spark"), brainCard = q("#s1-brain-card"), cardPulse = q("#s1-card-pulse");
            var p1 = q("#s1-pill-1"), p2 = q("#s1-pill-2");

            gsap.set(stage, { opacity: 1 });
            gsap.set(cam, { scale: 0.96, transformOrigin: "50% 60%" });
            gsap.set(brainCard, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" });

            var tl = gsap.timeline({ paused: true });

            // Rich continuous sleep animations: camera push-in, breathing chest, subtle head tilt, twinkling stars & bedside lamp
            tl.to(cam, { scale: 1.07, x: 34, duration: 6.2, ease: "sine.inOut" }, 0)
              .to(chest, { y: -9, scaleY: 1.05, transformOrigin: "50% 100%", duration: 1.8, repeat: 4, yoyo: true, ease: "sine.inOut" }, 0)
              .to(head, { y: -3, rotation: 1.8, transformOrigin: "50% 50%", duration: 1.8, repeat: 4, yoyo: true, ease: "sine.inOut" }, 0.15)
              .to([st1, st2], { scale: 1.5, opacity: 0.35, transformOrigin: "50% 50%", duration: 1.1, stagger: 0.4, repeat: 6, yoyo: true }, 0)
              .to(halo, { scale: 1.15, opacity: 0.72, transformOrigin: "50% 50%", duration: 1.8, repeat: 4, yoyo: true }, 0)
              .to(clk, { opacity: 0.5, duration: 0.8, repeat: 9, yoyo: true }, 0)
              .fromTo(p1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.3);

            // Multi-wave floating Zzz cycle (continuous across entire scene!)
            [
              { el: z1, t: 0.1, dx: 22, rot: -10 },
              { el: z2, t: 0.9, dx: 28, rot: 12 },
              { el: z3, t: 1.7, dx: 34, rot: -8 },
              { el: z4, t: 2.6, dx: 24, rot: 10 },
              { el: z5, t: 3.4, dx: 32, rot: -12 }
            ].forEach(function (z) {
              tl.fromTo(z.el,
                { opacity: 0, y: 12, x: 0, scale: 0.65, rotation: 0 },
                { opacity: 0.95, y: -95, x: z.dx, scale: 1.15, rotation: z.rot, duration: 2.6, repeat: 2, ease: "sine.out" },
                z.t
              ).to(z.el, { opacity: 0, duration: 0.5, immediateRender: false }, z.t + 2.1);
            });

            // Beat 2 (~3.2s): "KEVIN!" speech callout + waves -> Detailed Brain inside head lights up brightly!
            tl.fromTo(caller, { opacity: 0, scale: 0.8, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 3.1)
              .to(caller, { scale: 1.05, duration: 0.45, repeat: 4, yoyo: true, ease: "sine.inOut", immediateRender: false }, 3.6)
              .to(waves, { opacity: 1, duration: 0.25 }, 3.3)
              .fromTo([cw1, cw2, cw3], { x: -20, opacity: 0.95 }, { x: 42, opacity: 0.18, duration: 0.85, stagger: 0.14, repeat: 3, ease: "power2.out" }, 3.35)
              .to(brainGlow, { opacity: 1, scale: 1.14, transformOrigin: "50% 50%", duration: 0.55, ease: "back.out(1.6)" }, 4.2)
              .to(spark, { opacity: 0.9, scale: 1.45, transformOrigin: "50% 50%", duration: 0.42, repeat: 7, yoyo: true }, 4.3);

            // Beat 3 (~5.8s): Top detailed Brain Card + Question pill
            tl.to(p1, { opacity: 0, y: -10, duration: 0.22, ease: "power2.in", immediateRender: false }, 5.7)
              .fromTo(p2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 5.9)
              .to(brainCard, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, 6.0)
              .to(cardPulse, { scale: 1.35, opacity: 0.8, transformOrigin: "50% 50%", duration: 0.5, repeat: 4, yoyo: true }, 6.4)
              .to(stage, { opacity: 0, duration: 0.48, ease: "power2.inOut", immediateRender: false }, 9.17);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-01"] = tl;
          })();
        </script>
