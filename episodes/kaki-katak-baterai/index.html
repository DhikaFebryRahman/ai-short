<!doctype html>
<html
  lang="id"
  data-resolution="portrait"
  data-composition-variables='[
    { "id": "series_label", "type": "string", "label": "Label Seri", "default": "KAPSUL FAKTA" },
    { "id": "accent_amber", "type": "color", "label": "Aksen Amber", "default": "#FFB703" },
    { "id": "accent_cyan", "type": "color", "label": "Aksen Cyan", "default": "#0EA5E9" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kapsul Fakta — Kisah Kaki Katak &amp; Baterai Pertama</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --sky-top: #bbe5ff; --sky-mid: #fff6e5; --floor-warm: #fce7c8;
        --ink: #142244; --muted: #243b6b; --amber: #ffb703; --amber-ink: #9a3412;
        --cyan: #0ea5e9; --cyan-ink: #0369a1; --green: #10b981; --green-ink: #047857;
        --red: #f43f5e; --red-ink: #be123c;
        --font-display: "Poppins", sans-serif; --font-serif: "Playfair Display", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--sky-mid); font-family: var(--font-display); color: var(--ink); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(180deg, #bbe5ff 0%, #fff6e5 56%, #fce7c8 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="56" data-fps="30" data-width="1080" data-height="1920">
      <div id="backdrop" data-composition-id="backdrop" data-composition-src="compositions/backdrop.html" data-track-kind="graphics" data-track-index="0" data-start="0" data-duration="56" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="scene-01" data-composition-id="scene-01" data-composition-src="compositions/scene-01.html" data-track-kind="graphics" data-track-index="1" data-start="0" data-duration="5.50" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="scene-02" data-composition-id="scene-02" data-composition-src="compositions/scene-02.html" data-track-kind="graphics" data-track-index="1" data-start="5.50" data-duration="13.40" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="scene-03" data-composition-id="scene-03" data-composition-src="compositions/scene-03.html" data-track-kind="graphics" data-track-index="1" data-start="18.90" data-duration="11.60" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="scene-04" data-composition-id="scene-04" data-composition-src="compositions/scene-04.html" data-track-kind="graphics" data-track-index="1" data-start="30.50" data-duration="14.86" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="scene-05" data-composition-id="scene-05" data-composition-src="compositions/scene-05.html" data-track-kind="graphics" data-track-index="1" data-start="45.36" data-duration="10.64" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html" data-track-kind="graphics" data-track-index="2" data-start="0" data-duration="56" data-width="1080" data-height="1920" style="z-index: 30"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions" data-track-index="3" data-start="0" data-duration="56" data-width="1080" data-height="1920" style="z-index: 40"></div>

      <audio id="vo-track" class="clip" src="assets/audio/vo.mp3" data-start="1" data-duration="53.00" data-volume="1" data-track-index="4"></audio>
      <audio id="bgm-part1" class="clip" src="assets/audio/bgm.wav" data-start="0" data-duration="50" data-volume="0.14" data-fade-in="0.8" data-track-index="5"></audio>

      <audio id="sfx-metal-2" class="clip" src="assets/audio/sfx/metal-clink.wav" data-start="32.70" data-duration="0.45" data-volume="0.28" data-track-index="6"></audio>

      <audio id="sfx-pop-2" class="clip" src="assets/audio/sfx/pop-soft.wav" data-start="49.50" data-duration="0.28" data-volume="0.26" data-track-index="6"></audio>
      <audio id="sfx-chime-2" class="clip" src="assets/audio/sfx/discovery-chime.wav" data-start="50.10" data-duration="1.10" data-volume="0.24" data-track-index="6"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
