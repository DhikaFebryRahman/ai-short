          <div class="s1-pill-bar">

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var camera = root.querySelector("#s1-camera");
            var probeAnim = root.querySelector("#s1-probe-anim");
            var trayAnim = root.querySelector("#s1-tray-anim");
            var calf = root.querySelector("#s1-calf");
            var muscleGlow = root.querySelector("#s1-muscle-glow");
            var sparkPath = root.querySelector("#s1-spark-path");
            var sparkDot = root.querySelector("#s1-spark-dot");
            var clueLink = root.querySelector("#s1-clue-link");
            var batAnim = root.querySelector("#s1-bat-anim");
            var wipeLine = root.querySelector("#s1-wipe-line");
            var pill1 = root.querySelector("#s1-pill-1");
            var pill2 = root.querySelector("#s1-pill-2");

            var sparkLen = sparkPath.getTotalLength();
            var wipeLen = wipeLine.getTotalLength();

            gsap.set(sparkPath, { strokeDasharray: sparkLen, strokeDashoffset: sparkLen });
            gsap.set(wipeLine, { strokeDasharray: wipeLen, strokeDashoffset: wipeLen, opacity: 1 });
            gsap.set(probeAnim, { x: 140, y: -110, rotation: 16, transformOrigin: "0px 20px" });
            gsap.set(calf, { rotation: 0, transformOrigin: "0px 0px" });
            gsap.set(batAnim, { scale: 0.45, transformOrigin: "0px 0px" });
            gsap.set(pill1, { opacity: 0, y: 14 });
            gsap.set(pill2, { opacity: 0, y: 14 });

            var sparkTracker = { p: 0 };
            function syncSpark() {
              var pt = sparkPath.getPointAtLength(sparkTracker.p * sparkLen);
              gsap.set(sparkDot, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
            }

            var tl = gsap.timeline({ paused: true });

            // Ambient + camera push-in
            tl.to(camera, { scale: 1.13, x: 26, y: 20, duration: 2.35, ease: "power1.inOut" }, 0);
            tl.to(pill1, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 0.35);

            // Probe approaches nerve
            tl.to(probeAnim, { x: 0, y: 0, rotation: 0, duration: 1.65, ease: "power2.inOut" }, 0.65);

            // Nerve contact + Muscle contraction twitch (at ~2.35s)
            tl.set(sparkDot, { opacity: 1 }, 2.32);
            tl.to(sparkPath, { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" }, 2.32);
            tl.to(sparkTracker, { p: 1, duration: 0.36, ease: "power2.out", onUpdate: syncSpark }, 2.32);
            tl.to(muscleGlow, { opacity: 0.55, duration: 0.14, ease: "power2.out" }, 2.36);
            tl.to(muscleGlow, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 2.55);

            // Kick + elastic rebound
            tl.to(calf, { rotation: -26, duration: 0.16, ease: "power3.out" }, 2.38);
            tl.to(calf, { rotation: 0, duration: 0.55, ease: "elastic.out(1, 0.45)", immediateRender: false }, 2.54);
            tl.to(trayAnim, { y: 6, duration: 0.12, ease: "power2.out" }, 2.38);
            tl.to(trayAnim, { y: 0, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 2.5);
            tl.to(camera, { scale: 1.18, duration: 0.18, ease: "power2.out" }, 2.38);
            tl.to(camera, { scale: 1.04, x: -24, y: 12, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 3.1);
            tl.to([sparkPath, sparkDot], { opacity: 0, duration: 0.3 }, 2.95);

            // Battery clue reveal
            tl.to(pill1, { opacity: 0, y: -10, duration: 0.22, ease: "power2.in", immediateRender: false }, 3.15);
            tl.to(pill2, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 3.35);
            tl.to(clueLink, { opacity: 0.9, duration: 0.4, ease: "power2.out" }, 3.35);
            tl.to(batAnim, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 3.45);
            tl.to(batAnim, { y: -10, duration: 1.0, ease: "sine.inOut", immediateRender: false }, 4.05);

            // Outgoing electric transition sweep into Scene 2
            tl.to(wipeLine, { strokeDashoffset: 0, duration: 0.42, ease: "power3.inOut" }, 5.05);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-01"] = tl;
          })();
        </script>
