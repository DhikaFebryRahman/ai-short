        <script>
          (function () {
            "use strict";
            var SVG_NS = "http://www.w3.org/2000/svg";
            var root = document.getElementById("root");
            var camera = root.querySelector("#s4-camera");
            var stackHost = root.querySelector("#s4-stack-host");

            var callCu = root.querySelector("#s4-call-cu");
            var wireTop = root.querySelector("#s4-wire-top");
            var wireBot = root.querySelector("#s4-wire-bot");
            var flowLoop = root.querySelector("#s4-flow-loop");
            var orb1 = root.querySelector("#s4-cur-orb-1");
            var orb2 = root.querySelector("#s4-cur-orb-2");
            var orb3 = root.querySelector("#s4-cur-orb-3");
            var meter = root.querySelector("#s4-meter");
            var led = root.querySelector("#s4-led");
            var ledHalo = root.querySelector("#s4-led-halo");
            var terminals = root.querySelector("#s4-terminals");
            var needle = root.querySelector("#s4-needle");
            var topHeader = root.querySelector("#s4-top-header");
            var pillFirst = root.querySelector("#s4-pill-first");

            var spec = [
              { side: "url(#s4-zn-side)", top: "#E2E8F0", rx: 112, ry: 27, h: 16 },
              { side: "url(#s4-pad-side)", top: "#7DD3FC", rx: 102, ry: 24, h: 12 },
              { side: "url(#s4-cu-side)", top: "#FDBA74", rx: 112, ry: 27, h: 16 },
            ];
            var discs = [];
            var yCursor = 0;
            for (var i = 0; i < 12; i++) {
              var s = spec[i % 3];
              var g = document.createElementNS(SVG_NS, "g");
              var targetY = -yCursor - 8;
              yCursor += s.h + 11;
              var pathSide = document.createElementNS(SVG_NS, "path");
              pathSide.setAttribute("d", "M" + (-s.rx) + " 0 L" + (-s.rx) + " " + s.h + " A" + s.rx + " " + s.ry + " 0 0 0 " + s.rx + " " + s.h + " L" + s.rx + " 0 Z");
              pathSide.setAttribute("fill", s.side);
              pathSide.setAttribute("stroke", "#142244");
              pathSide.setAttribute("stroke-width", "4");
              var ellTop = document.createElementNS(SVG_NS, "ellipse");
              ellTop.setAttribute("cx", "0"); ellTop.setAttribute("cy", "0");
              ellTop.setAttribute("rx", String(s.rx)); ellTop.setAttribute("ry", String(s.ry));
              ellTop.setAttribute("fill", s.top); ellTop.setAttribute("stroke", "#142244"); ellTop.setAttribute("stroke-width", "4");
              var bevel = document.createElementNS(SVG_NS, "ellipse");
              bevel.setAttribute("cx", "-14"); bevel.setAttribute("cy", "-3");
              bevel.setAttribute("rx", String(Math.round(s.rx * 0.62))); bevel.setAttribute("ry", String(Math.round(s.ry * 0.48)));
              bevel.setAttribute("fill", "#FFFFFF"); bevel.setAttribute("opacity", "0.35");
              g.appendChild(pathSide); g.appendChild(ellTop); g.appendChild(bevel);
              stackHost.appendChild(g);
              discs.push({ el: g, targetY: targetY });
              gsap.set(g, { attr: { transform: "translate(0, " + (targetY - 260) + ")" }, opacity: 0 });
            }

            var wtLen = wireTop.getTotalLength();
            var wbLen = wireBot.getTotalLength();
            var loopLen = flowLoop.getTotalLength();
            gsap.set(wireTop, { strokeDasharray: wtLen, strokeDashoffset: wtLen, opacity: 0 });
            gsap.set(wireBot, { strokeDasharray: wbLen, strokeDashoffset: wbLen, opacity: 0 });
            gsap.set(camera, { rotationY: -10, scale: 1.14, x: 28, y: 26 });
            gsap.set([callZn, callPad, callCu], { x: 28 });
            gsap.set(meter, { scale: 0.65, transformOrigin: "0px 0px" });

            var needleState = { deg: -46 };
            function syncNeedle() {
              needle.setAttribute("transform", "rotate(" + needleState.deg.toFixed(1) + " 0 0)");
            }
            syncNeedle();

            var flowState = { p: 0 };
            function syncFlow() {
              [orb1, orb2, orb3].forEach(function (orb, idx) {
                var pt = flowLoop.getPointAtLength(((flowState.p + idx * 0.333) % 1) * loopLen);
                gsap.set(orb, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
              });
            }

            var tl = gsap.timeline({ paused: true });
            tl.to(camera, { rotationY: 6, scale: 1.08, x: 14, y: 12, duration: 2.2, ease: "power1.inOut" }, 0);
            tl.to(discs[0].el, { opacity: 1, attr: { transform: "translate(0, " + discs[0].targetY + ")" }, duration: 0.6, ease: "back.out(1.4)" }, 2.1);
            tl.to(callZn, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.5)" }, 2.4);
            tl.to(discs[1].el, { opacity: 1, attr: { transform: "translate(0, " + discs[1].targetY + ")" }, duration: 0.6, ease: "back.out(1.4)" }, 3.4);
            tl.to(callPad, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.5)" }, 3.7);
            tl.to(discs[2].el, { opacity: 1, attr: { transform: "translate(0, " + discs[2].targetY + ")" }, duration: 0.6, ease: "back.out(1.4)" }, 4.6);
            tl.to(callCu, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.5)" }, 4.9);

            tl.to([callZn, callPad, callCu], { opacity: 0, duration: 0.35, immediateRender: false }, 6.1);
            tl.to(camera, { rotationY: 0, scale: 1.0, x: 0, y: 0, duration: 1.8, ease: "power2.inOut", immediateRender: false }, 5.9);
            tl.to([rodL, rodR], { opacity: 1, duration: 0.5 }, 6.1);
            for (var d = 3; d < discs.length; d++) {
              tl.to(discs[d].el, { opacity: 1, attr: { transform: "translate(0, " + discs[d].targetY + ")" }, duration: 0.45, ease: "power3.out" }, 6.2 + (d - 3) * 0.25);
            }
            tl.to(topCap, { opacity: 1, duration: 0.45 }, 8.65);

            tl.to(topHeader, { opacity: 1, duration: 0.45 }, 8.55);
            tl.to(terminals, { opacity: 1, duration: 0.25 }, 8.65);
            tl.set([wireTop, wireBot], { opacity: 1 }, 8.7);
            tl.to(wireTop, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 8.7);
            tl.to(wireBot, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 8.72);
            tl.to(meter, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 8.85);

            // By t=9.50s (40.0s global): circuit connected, orbs flowing, LED glowing, needle sweeps to active green!
            tl.set([orb1, orb2, orb3], { opacity: 1 }, 9.25);
            tl.to(flowState, { p: 3.6, duration: 5.0, ease: "none", onUpdate: syncFlow }, 9.25);
            tl.to(led, { attr: { fill: "#10B981" }, duration: 0.2 }, 9.3);
            tl.to(ledHalo, { opacity: 0.45, duration: 0.3, ease: "power2.out" }, 9.3);
            tl.to(needleState, { deg: 40, duration: 0.65, ease: "elastic.out(1, 0.55)", onUpdate: syncNeedle }, 9.28)
              .to(needleState, { deg: 35, duration: 1.1, ease: "sine.inOut", onUpdate: syncNeedle, immediateRender: false }, 10.1)
              .to(needleState, { deg: 42, duration: 1.1, ease: "sine.inOut", onUpdate: syncNeedle, immediateRender: false }, 11.2)
              .to(needleState, { deg: 37, duration: 1.1, ease: "sine.inOut", onUpdate: syncNeedle, immediateRender: false }, 12.3);
            tl.to(pillFirst, { opacity: 1, duration: 0.45 }, 11.1);
            tl.to(camera, { scale: 1.18, x: 45, y: 14, duration: 0.75, ease: "power2.in", immediateRender: false }, 14.1);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
