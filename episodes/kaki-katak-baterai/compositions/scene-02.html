        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var camera = root.querySelector("#s2-camera");
            var introCard = root.querySelector("#s2-intro-card");
            var galvaniPos = root.querySelector("#s2-galvani-pos");
            var armR = root.querySelector("#s2-galvani-arm-r-wrap");
            var eyeL = root.querySelector("#s2-eye-l");
            var eyeR = root.querySelector("#s2-eye-r");
            var lensAnim = root.querySelector("#s2-lens-anim");
            var probeCu = root.querySelector("#s2-probe-copper");
            var probeFe = root.querySelector("#s2-probe-iron");
            var impulsePath = root.querySelector("#s2-impulse-path");
            var impulseDot = root.querySelector("#s2-impulse-dot");
            var muscleBundle = root.querySelector("#s2-muscle-bundle");
            var pillContract = root.querySelector("#s2-pill-contract");
            var noteAnim = root.querySelector("#s2-note-anim");
            var handoffWash = root.querySelector("#s2-handoff-wash");

            var impLen = impulsePath.getTotalLength();
            gsap.set(impulsePath, { strokeDasharray: impLen, strokeDashoffset: impLen });
            gsap.set(lensAnim, { scale: 0.55, transformOrigin: "0px 0px" });
            gsap.set(probeCu, { x: -46, y: -48 });
            gsap.set(probeFe, { x: 46, y: -48 });
            gsap.set(muscleBundle, { scaleX: 1, scaleY: 1, transformOrigin: "0px 0px" });
            gsap.set(noteAnim, { scale: 0.72, y: 70, transformOrigin: "0px 0px" });
            gsap.set(introCard, { opacity: 0, y: 18 });

            var impState = { p: 0 };
            function syncImp() {
              var pt = impulsePath.getPointAtLength(impState.p * impLen);
              gsap.set(impulseDot, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
            }

            var tl = gsap.timeline({ paused: true });

            // Phase A: Lab entry, Galvani observes & writes notes
            tl.to(camera, { scale: 1.07, x: -20, y: 14, duration: 5.5, ease: "sine.inOut" }, 0);
            tl.to(introCard, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.4);
            tl.to(galvaniPos, { attr: { transform: "translate(405, 815)" }, duration: 4.5, ease: "power1.inOut" }, 0.3);
            tl.to(armR, { rotation: -12, duration: 0.55, ease: "sine.inOut" }, 1.0)
              .to(armR, { rotation: 4, duration: 0.55, ease: "sine.inOut", immediateRender: false }, 1.6)
              .to(armR, { rotation: -8, duration: 0.55, ease: "sine.inOut", immediateRender: false }, 2.2);

            // Deterministic blinks
            tl.to([eyeL, eyeR], { attr: { r: 0.8 }, duration: 0.06 }, 2.8)
              .to([eyeL, eyeR], { attr: { r: 4.5 }, duration: 0.08, immediateRender: false }, 2.88)
              .to([eyeL, eyeR], { attr: { r: 0.8 }, duration: 0.06 }, 5.1)
              .to([eyeL, eyeR], { attr: { r: 4.5 }, duration: 0.08, immediateRender: false }, 5.18);

            tl.to(introCard, { opacity: 0, y: -12, duration: 0.32, ease: "power2.in", immediateRender: false }, 5.65);

            // Phase B: Magnifier Nerve + Muscle Contraction
            tl.to(camera, { scale: 1.02, x: 12, y: -16, duration: 1.2, ease: "power2.inOut", immediateRender: false }, 5.85);
            tl.to(lensAnim, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 6.0);

            // Metal probes touch nerve (~8.2s local = ~13.7s global)
            tl.to(probeCu, { x: 0, y: 0, duration: 0.9, ease: "power2.out" }, 7.3);
            tl.to(probeFe, { x: 0, y: 0, duration: 0.9, ease: "power2.out" }, 7.45);

            // Impulse wave & contraction (twice for clarity as narration explains)
            tl.set(impulseDot, { opacity: 1 }, 8.45);
            tl.to(impulsePath, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 8.45);
            tl.to(impState, { p: 1, duration: 0.45, ease: "power2.out", onUpdate: syncImp }, 8.45);
            tl.to(muscleBundle, { scaleX: 0.78, scaleY: 1.22, duration: 0.22, ease: "power3.out" }, 8.8);
            tl.to(muscleBundle, { scaleX: 1, scaleY: 1, duration: 0.65, ease: "elastic.out(1, 0.5)", immediateRender: false }, 9.05);
            tl.to(pillContract, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 8.75);

            // Second subtle pulse
            tl.set(impulsePath, { strokeDashoffset: impLen }, 10.2);
            tl.set(impState, { p: 0 }, 10.2);
            tl.to(impulsePath, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 10.25);
            tl.to(impState, { p: 1, duration: 0.45, ease: "power2.out", onUpdate: syncImp }, 10.25);
            tl.to(muscleBundle, { scaleX: 0.82, scaleY: 1.18, duration: 0.2, ease: "power3.out", immediateRender: false }, 10.65);
            tl.to(muscleBundle, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1, 0.5)", immediateRender: false }, 10.88);
            tl.to(camera, { scale: 1.1, duration: 1.8, ease: "power1.inOut", immediateRender: false }, 9.2);

            // Smooth notebook handoff + gradient cross-dissolve into Scene 3
            tl.to(pillContract, { opacity: 0, y: 10, duration: 0.35, ease: "power2.in", immediateRender: false }, 12.0);
            tl.to(lensAnim, { opacity: 0.15, scale: 0.88, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 12.05);
            tl.to(noteAnim, { opacity: 1, scale: 1.0, y: 0, duration: 0.6, ease: "power3.out" }, 12.05);
            tl.to(noteAnim, { scale: 1.14, opacity: 0, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 12.75);
            tl.to(handoffWash, { opacity: 1, duration: 0.65, ease: "power2.inOut" }, 12.72);
            tl.to(camera, { scale: 1.0, x: 0, y: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, 12.55);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-02"] = tl;
          })();
