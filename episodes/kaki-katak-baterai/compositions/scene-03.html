          (function () {

            var root = document.getElementById("root");
            var camera = root.querySelector("#s3-camera");

            var panelV = root.querySelector("#s3-panel-volta");
            var spark1 = root.querySelector("#s3-bio-spark1");
            var spark2 = root.querySelector("#s3-bio-spark2");
            var bioAura = root.querySelector("#s3-bio-aura");
            var metalZn = root.querySelector("#s3-metal-zn");
            var metalCu = root.querySelector("#s3-metal-cu");
            var circuitLoop = root.querySelector("#s3-circuit-loop");
            var orb1 = root.querySelector("#s3-loop-orb1");
            var orb2 = root.querySelector("#s3-loop-orb2");
            var pillCompare = root.querySelector("#s3-pill-compare");

            var s1Len = spark1.getTotalLength();
            var s2Len = spark2.getTotalLength();
            var loopLen = circuitLoop.getTotalLength();

            gsap.set(spark1, { strokeDasharray: s1Len, strokeDashoffset: s1Len });
            gsap.set(spark2, { strokeDasharray: s2Len, strokeDashoffset: s2Len });
            gsap.set(circuitLoop, { strokeDasharray: loopLen, strokeDashoffset: loopLen });
            gsap.set(camera, { scale: 1.02, x: 18, y: 6 });
            gsap.set(panelG, { opacity: 0, y: 34, scale: 0.94 });
            gsap.set(panelV, { opacity: 0, y: 34, scale: 0.96 });
            gsap.set(metalZn, { x: 18 });
            gsap.set(metalCu, { x: -18 });

            var orbState = { p1: 0, p2: 0.5 };
            function syncOrbs() {
              var a = circuitLoop.getPointAtLength((orbState.p1 % 1) * loopLen);
              var b = circuitLoop.getPointAtLength((orbState.p2 % 1) * loopLen);
              gsap.set(orb1, { attr: { cx: a.x.toFixed(1), cy: a.y.toFixed(1) } });
              gsap.set(orb2, { attr: { cx: b.x.toFixed(1), cy: b.y.toFixed(1) } });
            }

            var tl = gsap.timeline({ paused: true });
            tl.to(panelG, { opacity: 1, y: 0, scale: 1, duration: 0.48, ease: "power3.out" }, 0)
              .to(panelV, { opacity: 0.42, y: 0, scale: 1, duration: 0.52, ease: "power3.out" }, 0.08)
              .to(camera, { scale: 1.05, x: 24, y: 6, duration: 0.75, ease: "power2.out", immediateRender: false }, 0);
            tl.to(spark1, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.65);
            tl.to(spark2, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.95);
            tl.to(bioAura, { opacity: 0.65, scale: 1.08, transformOrigin: "0px 0px", duration: 0.8, ease: "sine.inOut" }, 0.8)
              .to(bioAura, { opacity: 0.35, scale: 1, duration: 0.8, ease: "sine.inOut", immediateRender: false }, 1.6);

            tl.to(panelV, { opacity: 1, duration: 0.45, immediateRender: false }, 3.4);
            tl.to(camera, { x: -24, scale: 1.05, duration: 1.15, ease: "power3.inOut", immediateRender: false }, 3.55);

            tl.to([metalZn, metalCu], { x: 0, duration: 0.7, ease: "back.out(1.5)" }, 5.1);
            tl.to(camera, { scale: 1.07, y: -6, duration: 1.1, ease: "power2.inOut", immediateRender: false }, 5.6);

            tl.set([orb1, orb2], { opacity: 1 }, 6.1);
            tl.to(circuitLoop, { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, 6.0);
            tl.to(orbState, { p1: 2.4, p2: 2.9, duration: 4.5, ease: "none", onUpdate: syncOrbs }, 6.1);

            tl.to(camera, { x: 0, y: 0, scale: 1.0, duration: 0.95, ease: "power3.out", immediateRender: false }, 8.15);
            tl.to(pillCompare, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)" }, 8.55);

            tl.to(panelG, { x: -120, opacity: 0, duration: 0.55, ease: "power2.in", immediateRender: false }, 10.85);
            tl.to(panelV, { x: -232, scale: 1.05, duration: 0.65, ease: "power2.inOut", immediateRender: false }, 10.85);
            tl.to(pillCompare, { opacity: 0, duration: 0.3, immediateRender: false }, 10.95);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-03"] = tl;
