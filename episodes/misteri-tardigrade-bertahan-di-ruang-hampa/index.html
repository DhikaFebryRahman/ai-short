<!doctype html>
<html
  lang="id"
  data-resolution="portrait"
  data-composition-variables='[
    { "id": "series_label", "type": "string", "label": "Label Seri", "default": "KAPSUL FAKTA" },
    { "id": "accent_amber", "type": "color", "label": "Aksen Amber", "default": "#FFB703" },
    { "id": "accent_cyan", "type": "color", "label": "Aksen Cyan", "default": "#0EA5E9" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kapsul Fakta: Misteri Tardigrade di Ruang Hampa</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --space-top: #040814;
        --space-mid: #09132b;
        --space-bot: #0f2046;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --amber: #fbbf24;
        --amber-ink: #fde68a;
        --cyan: #38bdf8;
        --cyan-ink: #7dd3fc;
        --green: #34d399;
        --green-ink: #6ee7b7;
        --coral: #fb7185;
        --coral-ink: #fda4af;
        --font-display: "Poppins", sans-serif;
        --font-serif: "Playfair Display", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--space-mid);
        font-family: var(--font-display);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, #040814 0%, #09132b 52%, #0f2046 100%);
      }
    </style>
  </head>

    <script>

        var tl = gsap.timeline({ paused: true });
        tl.to({}, { duration: 74 }, 0);
