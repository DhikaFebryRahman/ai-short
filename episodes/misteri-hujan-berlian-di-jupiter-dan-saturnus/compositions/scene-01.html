              .to([diamJupAnim, diamSatAnim], { y: 16, duration: 2.0, ease: "sine.inOut", immediateRender: false }, 7.9)
              .to(p2, { opacity: 0, y: -10, duration: 0.22, ease: "power2.in", immediateRender: false }, 7.65)
              .fromTo(p3, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 7.85);
