          (function () {

            var root = document.getElementById("root");
            var q = function (s) { return root.querySelector(s); };
            var stage = q("#s2-clip"), eyeDome = q("#s2-eye-dome"), midband = q("#s2-midband"), specPanel = q("#s2-spec-panel"), scanBeam = q("#s2-scan-beam");

            var wUv = q("#s2-wv-uv"), wVis = q("#s2-wv-vis"), wRed = q("#s2-wv-red");
            var ptUv = q("#s2-pt-uv"), ptVis = q("#s2-pt-vis"), ptRed = q("#s2-pt-red");
            var recs = [], bars = [];
            for (var i = 0; i < 12; i++) {
              recs.push(q("#s2-r" + i));
              bars.push(q("#s2-bar-" + i));
            }
            var p1 = q("#s2-pill-1"), p2 = q("#s2-pill-2");

            gsap.set(stage, { opacity: 0 });
            gsap.set(midband, { scale: 0.9, opacity: 0.4, transformOrigin: "50% 50%" });
            gsap.set(specPanel, { opacity: 0, y: 18 });
            gsap.set(bars, { scaleY: 0.25, transformOrigin: "50% 100%" });

            function makeWaveSync(pathEl, dotEl) {
              var len = pathEl.getTotalLength();
              var obj = { p: 0 };
              var update = function () {
                var pt = pathEl.getPointAtLength(obj.p * len);
                gsap.set(dotEl, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
              };
              update();
              return { obj: obj, update: update };
            }
            var sUv = makeWaveSync(wUv, ptUv);
            var sVis = makeWaveSync(wVis, ptVis);
            var sRed = makeWaveSync(wRed, ptRed);

            var tl = gsap.timeline({ paused: true });
            tl.to(stage, { opacity: 1, duration: 0.48, ease: "power2.out" }, 0)
              .fromTo(p1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 0.45)
              .to(eyeDome, { y: -8, rotation: 2.5, transformOrigin: "50% 50%", duration: 3.4, repeat: 3, yoyo: true, ease: "sine.inOut" }, 0.2)
              .to(midband, { scale: 1.04, opacity: 1, duration: 1.1, ease: "back.out(1.4)" }, 0.9)
              // Incoming rays flow continuously + photon dots ride curves into Midband
              .fromTo([wUv, wVis, wRed], { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -220 }, duration: 14.0, ease: "none" }, 0.2)
              .fromTo([fTop, fBot], { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": 180 }, duration: 14.0, ease: "none" }, 0.2)

              .fromTo(sRed.obj, { p: 0 }, { p: 1, duration: 1.7, repeat: 7, ease: "power1.in", onUpdate: sRed.update }, 0.9)
              // Scan beam sweeps across Midband & lights up 12 photoreceptors + 12 spectrum bars sequentially
              .to(scanBeam, { opacity: 1, duration: 0.3 }, 4.2)

              .to(recs, { scaleY: 1.0, duration: 0.5, stagger: 0.08, immediateRender: false }, 11.4)
              .to(stage, { opacity: 0, duration: 0.48, ease: "power2.inOut", immediateRender: false }, 14.60);
