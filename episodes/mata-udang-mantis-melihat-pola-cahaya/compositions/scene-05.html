              <g clip-path="url(#s5WaveClip)">

              <g transform="translate(775 545)">
                <g id="s5-eye-det">
                  <ellipse cx="0" cy="0" rx="74" ry="52" fill="#6ee7b7" stroke="#0f172a" stroke-width="4" />
                  <rect x="-68" y="-10" width="136" height="20" rx="10" fill="#4c1d95" stroke="#22d3ee" stroke-width="2.5" />

              <!-- Corkscrew Helix Wave flowing toward Rotating Vector Circle -->
              <g clip-path="url(#s5HelixClip)">
                <line x1="195" y1="868" x2="620" y2="868" stroke="#4c1d95" stroke-width="2" stroke-dasharray="8 8" />

                  <path id="s5-helix-wave" d="M80 868 C115 790 165 790 200 868 C235 946 285 946 320 868 C355 790 405 790 440 868 C475 946 525 946 560 868 C595 790 645 790 680 868" stroke="#c084fc" stroke-width="6" fill="none" />
                  <path id="s5-helix-wave-2" d="M120 868 C155 946 205 946 240 868 C275 790 325 790 360 868 C395 946 445 946 480 868 C515 790 565 790 600 868" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="8 6" opacity="0.7" fill="none" />
                  <circle id="s5-helix-dot" cx="200" cy="868" r="9" fill="#e9d5ff" stroke="#0f172a" stroke-width="2.5" />

              </g>

              <!-- Spinning Circular Polarization Vector Wheel on Right (Symmetric pivot at 0,0!) -->
              <g transform="translate(775 868)">

                  <polygon points="0,-78 -12,-54 12,-54" fill="#fbbf24" />

            <g id="s5-foreground">

          <div class="s5-header">

          <div class="s5-pill-bar">
            <div class="s5-pill" id="s5-pill-1"><span class="s5-pill-dot"></span><span>POLARISASI CAHAYA</span></div>
            <div class="s5-pill is-uv" id="s5-pill-2"><span class="s5-pill-dot"></span><span>DETEKSI POLARISASI MELINGKAR</span></div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelector(s); };
            var stage = q("#s5-clip");
            var linTrack = q("#s5-lin-track"), linWave = q("#s5-lin-wave"), linDot = q("#s5-lin-dot"), eyeDet = q("#s5-eye-det");
            var osc1 = q("#s5-osc-1"), osc2 = q("#s5-osc-2"), osc3 = q("#s5-osc-3");
            var circPanel = q("#s5-circ-panel"), hTrack = q("#s5-helix-track"), hWave = q("#s5-helix-wave"), hWave2 = q("#s5-helix-wave-2"), hDot = q("#s5-helix-dot");
            var spinVec = q("#s5-spin-vec"), wheelOuter = q("#s5-wheel-outer");
            var p1 = q("#s5-pill-1"), p2 = q("#s5-pill-2");

            gsap.set(stage, { opacity: 0 });
            gsap.set(circPanel, { opacity: 0.35, scale: 0.96, transformOrigin: "50% 50%" });

            var lLen = linWave.getTotalLength();
            var lObj = { t: 0.18 };
            function moveLinDot() {
              var pt = linWave.getPointAtLength(lObj.t * lLen);
              gsap.set(linDot, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
            }
            moveLinDot();

            var hLen = hWave.getTotalLength();
            var hObj = { t: 0.16 };
            function moveHDot() {
              var pt = hWave.getPointAtLength(hObj.t * hLen);
              gsap.set(hDot, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
            }
            moveHDot();

            var tl = gsap.timeline({ paused: true });
            tl.to(stage, { opacity: 1, duration: 0.48, ease: "power2.out" }, 0)
              .fromTo(p1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 0.45)
              .fromTo(linTrack, { x: 0 }, { x: -110, duration: 14.5, ease: "none" }, 0.2)
              .to([osc1, osc2, osc3], { scaleY: 1.25, transformOrigin: "50% 50%", duration: 0.65, stagger: 0.18, repeat: 18, yoyo: true, ease: "sine.inOut" }, 0.2)
              .to(eyeDet, { rotation: -12, transformOrigin: "50% 50%", duration: 1.3, repeat: 10, yoyo: true, ease: "sine.inOut" }, 0.3)
              .to(lObj, { t: 0.88, duration: 3.6, repeat: 3, yoyo: true, ease: "none", onUpdate: moveLinDot }, 0.2)
              // Circular wave & wheel also gently pre-animate, then burst brighter at 7.4s!
              .fromTo(hTrack, { x: 0 }, { x: -120, duration: 14.5, ease: "none" }, 0.2)
              .fromTo(hWave2, { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -180 }, duration: 14.5, ease: "none" }, 0.2)
              .to(spinVec, { rotation: 1080, transformOrigin: "50% 50%", duration: 14.8, ease: "none" }, 0.2)
              .to(wheelOuter, { rotation: -90, transformOrigin: "50% 50%", duration: 14.8, ease: "none" }, 0.2)
              // Circular Polarization spotlight (~7.4s local = 62.2s vid)
              .to(circPanel, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 7.4)
              .to(hObj, { t: 0.88, duration: 3.5, repeat: 1, yoyo: true, ease: "none", onUpdate: moveHDot }, 7.4)
              .to(p1, { opacity: 0, y: -10, duration: 0.22, ease: "power2.in", immediateRender: false }, 8.6)
              .fromTo(p2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 8.8)
              .to(stage, { opacity: 0, duration: 0.48, ease: "power2.inOut", immediateRender: false }, 15.40);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-05"] = tl;
          })();
        </script>
