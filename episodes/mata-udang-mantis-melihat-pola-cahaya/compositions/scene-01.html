        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var q = function (s) { return root.querySelector(s); };
            var stage = q("#s1-clip"), cam = q("#s1-cam"), halo = q("#s1-halo"), shrimp = q("#s1-shrimp");
            var eyeL = q("#s1-eye-l"), eyeR = q("#s1-eye-r"), ant1 = q("#s1-ant-1"), ant2 = q("#s1-ant-2"), tail = q("#s1-tail");
            var clubs = q("#s1-clubs"), legs = q("#s1-legs");
            var uvWaves = q("#s1-uv-waves"), uv1 = q("#s1-uv-1"), uv2 = q("#s1-uv-2"), uvOrb = q("#s1-uv-orb"), uvOrb2 = q("#s1-uv-orb-2"), uvTag = q("#s1-uv-tag"), specCard = q("#s1-spec-card");
            var b1 = q("#s1-b1"), b2 = q("#s1-b2"), b3 = q("#s1-b3"), b4 = q("#s1-b4");
            var kl = q("#s1-kelp-l"), kr = q("#s1-kelp-r");
            var p1 = q("#s1-pill-1"), p2 = q("#s1-pill-2");

            gsap.set(stage, { opacity: 1 });
            gsap.set(cam, { scale: 0.96, transformOrigin: "50% 60%" });
            gsap.set(shrimp, { x: -45, y: 12 });
            gsap.set(specCard, { opacity: 0, y: 18 });

            var uvLen1 = uv1.getTotalLength();
            var uvLen2 = uv2.getTotalLength();
            var uvProg1 = { p: 0 }, uvProg2 = { p: 0.25 };
            function syncUvOrb1() {
              var pt = uv1.getPointAtLength(uvProg1.p * uvLen1);
              gsap.set(uvOrb, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
            }
            function syncUvOrb2() {
              var pt = uv2.getPointAtLength(uvProg2.p * uvLen2);
              gsap.set(uvOrb2, { attr: { cx: pt.x.toFixed(1), cy: pt.y.toFixed(1) } });
            }
            syncUvOrb1();
            syncUvOrb2();

            var tl = gsap.timeline({ paused: true });
            // Beat 1 (0 - 4s): Dense underwater life, shrimp gliding, eyes rotating INDEPENDENTLY, clubs/legs/kelp/halo & curved UV photons!
            tl.to(shrimp, { x: 12, y: -6, duration: 4.5, ease: "sine.inOut" }, 0)
              .to(shrimp, { y: 4, duration: 2.2, repeat: 2, yoyo: true, ease: "sine.inOut", immediateRender: false }, 4.6)
              .to(cam, { scale: 1.09, x: -24, duration: 7.5, ease: "sine.inOut" }, 0.3)
              .to(halo, { rotation: 36, svgOrigin: "540 690", duration: 10.0, ease: "none" }, 0)
              .to(eyeL, { rotation: -24, transformOrigin: "50% 90%", duration: 1.2, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.1)
              .to(eyeR, { rotation: 28, transformOrigin: "50% 90%", duration: 1.0, repeat: 8, yoyo: true, ease: "sine.inOut" }, 0.35)
              .to([ant1, ant2], { rotation: 9, transformOrigin: "0% 50%", duration: 0.85, stagger: 0.2, repeat: 10, yoyo: true }, 0)
              .to(tail, { rotation: -8, transformOrigin: "90% 50%", duration: 1.1, repeat: 8, yoyo: true }, 0)
              .to(clubs, { rotation: -10, transformOrigin: "20% 0%", duration: 0.95, repeat: 9, yoyo: true, ease: "sine.inOut" }, 0.1)
              .to(legs, { rotation: 10, transformOrigin: "50% 0%", duration: 0.75, repeat: 12, yoyo: true, ease: "sine.inOut" }, 0)
              .to([kl, kr], { rotation: 8, transformOrigin: "50% 100%", duration: 2.0, stagger: 0.3, repeat: 4, yoyo: true, ease: "sine.inOut" }, 0)
              .to([b1, b2, b3, b4], { y: -175, opacity: 0.1, duration: 3.4, stagger: 0.4, repeat: 2, ease: "sine.out" }, 0.05)
              .fromTo(p1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.35);

            // Beat 2 (0.6 - 10.3s): UV Waves enter early & photons ride exact sinusoidal path into eyes + Spectrum comparison bar
            tl.to(uvWaves, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6)
              .fromTo([uv1, uv2], { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -192 }, duration: 9.0, ease: "none" }, 0.6)
              .fromTo(uvProg1, { p: 0 }, { p: 1, duration: 1.65, repeat: 5, ease: "none", onUpdate: syncUvOrb1 }, 0.6)
              .fromTo(uvProg2, { p: 0 }, { p: 1, duration: 1.9, repeat: 4, ease: "none", onUpdate: syncUvOrb2 }, 0.9)
              .to(uvTag, { y: -7, duration: 1.1, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0.8)
              .to(specCard, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.3)", immediateRender: false }, 4.6)
              .to(p1, { opacity: 0, y: -10, duration: 0.22, ease: "power2.in", immediateRender: false }, 4.9)
              .fromTo(p2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 5.1)
              .to(stage, { opacity: 0, duration: 0.48, ease: "power2.inOut", immediateRender: false }, 9.82);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["scene-01"] = tl;
          })();
        </script>
