<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>HUD Top Bar Cerah</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="hud" data-duration="51" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            pointer-events: none;
            font-family: "Poppins", sans-serif;
          }

          .hud-wrap {
            position: absolute;
            top: 256px;
            left: 118px;
            width: 750px;
          }

          .hud-segments {
            display: flex;
            gap: 10px;
            width: 100%;
            height: 8px;
            margin-bottom: 16px;
          }

          .hud-seg {
            flex: 1;
            height: 100%;
            border-radius: 999px;
            background: rgba(20, 34, 68, 0.16);
            overflow: hidden;
          }

          .hud-fill {
            width: 100%;
            height: 100%;
            background: #f59e0b;
            transform-origin: left center;
          }

          .hud-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
          }

          .hud-series {
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(255, 252, 245, 0.88);
            border: 1.5px solid rgba(20, 34, 68, 0.14);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: #142244;
            text-transform: uppercase;
          }

          .hud-counter {
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(255, 252, 245, 0.88);
            border: 1.5px solid rgba(245, 158, 11, 0.45);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: #9a3412;
            font-variant-numeric: tabular-nums;
          }
        </style>

        <div
          id="hud-clip"
          class="hud-wrap clip"
          data-start="0"
          data-duration="51"
          data-track-index="0"
        >
          <div class="hud-segments">
            <div class="hud-seg"><div class="hud-fill" id="hud-fill-0"></div></div>
            <div class="hud-seg"><div class="hud-fill" id="hud-fill-1"></div></div>
            <div class="hud-seg"><div class="hud-fill" id="hud-fill-2"></div></div>
            <div class="hud-seg"><div class="hud-fill" id="hud-fill-3"></div></div>
            <div class="hud-seg"><div class="hud-fill" id="hud-fill-4"></div></div>
            <div class="hud-seg"><div class="hud-fill" id="hud-fill-5"></div></div>
          </div>
          <div class="hud-meta">
            <div class="hud-series" data-var-text="series_label">KAPSUL FAKTA</div>
            <div class="hud-counter" id="hud-counter">01 / 06</div>
          </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
        <script>
          (function () {
            "use strict";
            var root = document.getElementById("root");
            var counterEl = root.querySelector("#hud-counter");
            var fills = [
              root.querySelector("#hud-fill-0"),
              root.querySelector("#hud-fill-1"),
              root.querySelector("#hud-fill-2"),
              root.querySelector("#hud-fill-3"),
              root.querySelector("#hud-fill-4"),
              root.querySelector("#hud-fill-5"),
            ];

            var scenes = [
              { start: 0, end: 5.77, label: "01 / 06" },
              { start: 5.77, end: 16.3, label: "02 / 06" },
              { start: 16.3, end: 24.43, label: "03 / 06" },
              { start: 24.43, end: 39.58, label: "04 / 06" },
              { start: 39.58, end: 48.8, label: "05 / 06" },
              { start: 48.8, end: 51, label: "06 / 06" },
            ];

            var state = { t: 0 };
            function renderHud() {
              var t = state.t;
              var activeLabel = "06 / 06";
              for (var i = 0; i < scenes.length; i++) {
                var s = scenes[i];
                var progress = 0;
                if (t >= s.end) {
                  progress = 1;
                } else if (t > s.start) {
                  progress = (t - s.start) / (s.end - s.start);
                }
                gsap.set(fills[i], { scaleX: progress });
                if (t >= s.start && t < s.end) {
                  activeLabel = s.label;
                }
              }
              counterEl.textContent = activeLabel;
            }

            var tl = gsap.timeline({ paused: true });
            tl.to(state, { t: 51, duration: 51, ease: "none", onUpdate: renderHud }, 0);
            renderHud();
            tl.seek(0);

            window.__timelines = window.__timelines || {};
            window.__timelines["hud"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
