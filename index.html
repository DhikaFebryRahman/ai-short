<!doctype html>
<html
  lang="id"
  data-resolution="portrait"
  data-composition-variables='[
    { "id": "series_label", "type": "string", "label": "Label Seri", "default": "KAPSUL FAKTA" },
    { "id": "accent_amber", "type": "color", "label": "Aksen Amber", "default": "#FFB703" },
    { "id": "accent_cyan", "type": "color", "label": "Aksen Cyan", "default": "#0EA5E9" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Kapsul Fakta — Misteri Déjà Vu (2D Cerah)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --sky-top: #cbe7ff;
        --sky-mid: #fff6e5;
        --floor-warm: #fce7c8;
        --ink: #142244;
        --muted: #2b3e6b;
        --amber: #ffb703;
        --amber-ink: #9a3412;
        --cyan: #0ea5e9;
        --cyan-ink: #0369a1;
        --green: #10b981;
        --green-ink: #047857;
        --red: #f43f5e;
        --red-ink: #be123c;
        --font-display: "Poppins", sans-serif;
        --font-serif: "Playfair Display", serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--sky-mid);
        font-family: var(--font-display);
        color: var(--ink);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, #cbe7ff 0%, #fff6e5 58%, #fce7c8 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="51"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="backdrop"
        data-composition-id="backdrop"
        data-composition-src="compositions/backdrop.html"
        data-track-kind="graphics"
        data-track-index="0"
        data-start="0"
        data-duration="51"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <div
        id="scene-01"
        data-composition-id="scene-01"
        data-composition-src="compositions/scene-01.html"
        data-track-kind="graphics"
        data-track-index="1"
        data-start="0"
        data-duration="5.77"
        data-width="1080"
        data-height="1920"
        style="z-index: 10"
      ></div>

      <div

      ></div>

      <div

      <div

      <div

      <div

      <audio

        data-track-index="4"
      ></audio>

      <audio
        id="bgm-part1"
        class="clip"
        src="assets/audio/bgm.wav"
        data-start="0"
        data-duration="45"
        data-volume="0.14"
        data-fade-in="0.8"
        data-track-index="5"
      ></audio>

      <audio
        id="bgm-part2"
        class="clip"
        src="assets/audio/bgm.wav"
        data-start="45"
        data-duration="6"
        data-volume="0.14"
        data-fade-out="1.6"
        data-track-index="5"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
